  <text x="814" y="364" font-family="Arial,sans-serif" font-size="15" fill="#526D7D">Signal: vibration trend</text>
  <text x="814" y="394" font-family="Arial,sans-serif" font-size="15" fill="#526D7D">Context: recipe and mode</text>
  <rect x="814" y="452" width="286" height="54" rx="9" fill="#1A929B"/>
  <text x="957" y="486" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#FFFFFF">ACKNOWLEDGE / REVIEW</text>
  <text x="60" y="596" font-family="Arial,sans-serif" font-size="15" fill="#657D87">Concept image only. It shows a possible interface hierarchy, not an actual product screen or measured result.</text>
